<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" id="themeColor" />
<title>小說閱讀器</title>
<style>
:root{
  --bg:#FFFFFF; --fg:#1B1D21; --fs:20px; --lh:1.9;
  --ff:"Noto Serif TC","Noto Serif HK","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --ui:-apple-system,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mute:color-mix(in srgb,var(--fg) 55%,var(--bg));
  --line:color-mix(in srgb,var(--fg) 14%,var(--bg));
  --soft:color-mix(in srgb,var(--fg) 6%,var(--bg));
  --tbh:52px; --pad:clamp(22px,6vw,72px);
}
html{background:var(--bg)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:calc(var(--tbh) + 70px)}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);min-height:100vh;transition:background .25s,color .25s;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}

/* 頂欄 */
#top{position:fixed;inset:0 0 auto 0;height:var(--tbh);padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  z-index:20;transition:transform .3s}
#top.hide{transform:translateY(-100%)}
#topTitle{flex:1;text-align:center;font-size:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pct{font-size:13px;color:var(--mute);min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
.tb{height:34px;padding:0 14px;border-radius:17px;font-size:14px}
.tb:hover{background:var(--soft)}
#bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:left}
body[data-view=list] .bookonly{display:none}

/* 搜尋列 */
#sbar{position:fixed;top:var(--tbh);left:50%;transform:translate(-50%,-12px);width:min(560px,calc(100% - 20px));margin-top:8px;
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;background:var(--bg);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:19;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s}
#sbar.open{opacity:1;visibility:visible;transform:translate(-50%,0)}
#sInput{flex:1;min-width:0;height:34px;border:0;background:none;outline:0;font-size:16px}
#sCount{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{width:34px;height:34px;border-radius:50%;font-size:16px;line-height:1}
.ib:hover{background:var(--soft)}

/* 正文 */
main{width:100%;max-width:calc(var(--fs)*40 + var(--pad)*2);margin:0 auto;padding:calc(var(--tbh) + 56px) var(--pad) 160px}
body[data-view=list] main{max-width:calc(720px + var(--pad)*2)}
h1{font-family:var(--ff);font-size:clamp(26px,5vw,42px);font-weight:700;text-align:center;letter-spacing:.08em;margin-bottom:64px}
#bookContent{font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
mark{background:#FFD54A;color:#111;border-radius:3px;padding:0 1px}
mark.cur{background:#FF9F1A;outline:2px solid #FF9F1A}
.note{font-family:var(--ui);white-space:normal;text-align:center;color:var(--mute);font-size:16px;line-height:1.8;padding:80px 0}
.note.err{color:#D0314E}
.note small{display:block;font-size:14px;margin-top:6px}

/* 書目 */
.books{list-style:none;font-family:var(--ff);border-top:1px solid var(--line)}
.books button{display:block;width:100%;text-align:left;padding:22px 4px;font-size:clamp(20px,3.4vw,26px);border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.books button:hover{padding-left:16px;background:var(--soft)}
#listHead{font-family:var(--ff);margin-bottom:36px;display:flex;align-items:baseline;gap:14px}
#listHead b{font-size:clamp(40px,8vw,64px);letter-spacing:.1em;font-weight:700}
#listHead span{color:var(--mute);font-family:var(--ui);font-size:15px}

/* 浮動按鈕 */
.fab,#dock button{height:48px;border-radius:24px;background:var(--fg);color:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.22);font-size:15px;transition:transform .15s,opacity .25s}
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));z-index:18}
.fab:active,#dock button:active{transform:scale(.95)}
#dock{position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:18}
#dock button{padding:0 20px;display:flex;align-items:center;gap:8px}
#dock i{font-style:normal;font-family:var(--ff);font-weight:700;font-size:17px}
#topBtn{right:max(20px,env(safe-area-inset-right));width:48px;font-size:20px;opacity:0;pointer-events:none}
#topBtn.show{opacity:1;pointer-events:auto}

/* 設定彈窗 */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;
  visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s}
.overlay.open{visibility:visible;opacity:1}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 22px max(24px,env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .25s}
.overlay.open .sheet{transform:none}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:20px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.3)}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sh b{font-size:20px}
.row{padding:16px 0;border-top:1px solid var(--line)}
.row>label,.row>.lb{display:block;font-size:14px;color:var(--mute);margin-bottom:10px}
.line{display:flex;align-items:center;gap:8px}
.in{flex:1;min-width:0;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.in:focus{outline:2px solid var(--fg);outline-offset:-1px}
.btn{height:42px;padding:0 20px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=range]{flex:1;min-width:0;accent-color:var(--fg);height:30px}
.num{width:76px;flex:none;text-align:center}
.seg,.pre{display:grid;gap:8px}
.seg{grid-template-columns:1fr 1fr}.pre{grid-template-columns:repeat(4,1fr)}
.seg button,.pre button{height:42px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pre button[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}
.cl{display:grid;grid-template-columns:2.5em 1fr 48px;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.hex{height:42px;min-width:0;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.hex:focus{outline:2px solid var(--fg);outline-offset:-1px}
.hex.bad{border-color:#D0314E}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
input[type=color]{width:48px;height:42px;border:1px solid var(--line);border-radius:10px;background:none;padding:3px;cursor:pointer}
.sheet .books button{font-size:19px;padding:16px 4px;display:flex;justify-content:space-between;align-items:center}
.books button[aria-current=true]{font-weight:700}
.books button[aria-current=true]::after{content:"閱讀中";font-family:var(--ui);font-size:13px;font-weight:400;color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-view="list">

<header id="top">
  <div id="topTitle">書目</div>
  <span id="pct" class="bookonly"></span>
  <button class="tb bookonly" id="searchBtn">搜尋</button>
  <div id="bar"></div>
</header>

<div id="sbar" role="search">
  <input id="sInput" type="search" placeholder="搜尋本書內容" autocomplete="off" enterkeyhint="search" />
  <span id="sCount"></span>
  <button class="ib" id="sPrev" title="上一個" aria-label="上一個">↑</button>
  <button class="ib" id="sNext" title="下一個" aria-label="下一個">↓</button>
  <button class="ib" id="sClose" title="關閉搜尋" aria-label="關閉搜尋">✕</button>
</div>

<main id="main">
  <div id="listHead"><b>書目</b><span id="listCount"></span></div>
  <h1 id="bookTitle" hidden></h1>
  <div id="bookContent"></div>
</main>

<div id="dock"><button id="libBtn" aria-haspopup="dialog">書目</button><button id="menuBtn" aria-haspopup="dialog"><i>Aa</i>設定</button></div>
<button class="fab" id="topBtn" aria-label="回到頂部">↑</button>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="設定">
    <div class="sh"><b>設定</b><button class="ib" id="closeBtn" aria-label="關閉">✕</button></div>

    <div class="row" style="border-top:0;padding-top:0">
      <label for="bookInput">書名</label>
      <div class="line">
        <input class="in" id="bookInput" type="text" placeholder="輸入書名，例如 西遊記" autocomplete="off" />
        <button class="btn p" id="readBtn">閱讀</button>
      </div>
    </div>

    <div class="row">
      <label for="fsNum">字體大小（8 – 128）</label>
      <div class="line">
        <button class="ib btn" id="fsMinus" aria-label="縮小" style="width:42px;padding:0">−</button>
        <input type="range" id="fsRange" min="8" max="128" step="1" aria-label="字體大小滑桿" />
        <button class="ib btn" id="fsPlus" aria-label="放大" style="width:42px;padding:0">+</button>
        <input class="in num" id="fsNum" type="number" min="8" max="128" inputmode="numeric" />
      </div>
    </div>

    <div class="row">
      <label for="lhRange">行距　<b id="lhVal" style="color:var(--fg)"></b></label>
      <div class="line"><input type="range" id="lhRange" min="1.3" max="2.8" step="0.1" /></div>
    </div>

    <div class="row">
      <div class="lb">字體</div>
      <div class="seg" id="ffSeg">
        <button data-ff="serif" style="font-family:var(--ff)">明體</button>
        <button data-ff="sans">黑體</button>
      </div>
    </div>

    <div class="row">
      <div class="lb">配色</div>
      <div class="pre" id="presets"></div>
      <div class="cl"><span>背景</span><input class="hex" id="bgHex" maxlength="7" placeholder="#FFFFFF" spellcheck="false" autocomplete="off" aria-label="背景顏色色碼" /><input type="color" id="bgColor" aria-label="選擇背景顏色" /></div>
      <div class="cl"><span>文字</span><input class="hex" id="fgHex" maxlength="7" placeholder="#1B1D21" spellcheck="false" autocomplete="off" aria-label="文字顏色色碼" /><input type="color" id="fgColor" aria-label="選擇文字顏色" /></div>
      <p class="hint">可直接輸入 6 位色碼，例如 1B1D21</p>
    </div>

    <div class="row" style="padding-bottom:0"><button class="btn" id="resetBtn" style="width:100%">恢復預設</button></div>
  </div>
</div>

<div class="overlay" id="libOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="書目">
    <div class="sh"><b>書目 <small id="libCount" style="color:var(--mute);font-weight:400;font-size:14px"></small></b><button class="ib" id="libClose" aria-label="關閉">✕</button></div>
    <div id="libBody"></div>
  </div>
</div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const root = document.documentElement;
const bookInput = $('bookInput'), bookTitle = $('bookTitle'), bookContent = $('bookContent');
const listHead = $('listHead'), listCount = $('listCount'), topTitle = $('topTitle');
const readBtn = $('readBtn'), overlay = $('overlay'), libOverlay = $('libOverlay');
const sbar = $('sbar'), sInput = $('sInput'), sCount = $('sCount'), topBar = $('top');

/* ===== 本地儲存（只存閱讀偏好與進度） ===== */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ===== 閱讀偏好 ===== */
const DEF = { fs: 20, lh: 1.9, ff: 'serif', bg: '#FFFFFF', fg: '#1B1D21' };
const FONTS = {
  serif: '"Noto Serif TC","Noto Serif HK","Source Han Serif TC","Songti TC","PMingLiU","MingLiU",serif',
  sans: '"Noto Sans TC","PingFang HK","PingFang TC","Microsoft JhengHei",sans-serif'
};
const PRESETS = [
  { n: '白紙', bg: '#FFFFFF', fg: '#1B1D21' },
  { n: '淺灰', bg: '#E8EAED', fg: '#22252A' },
  { n: '豆沙綠', bg: '#CCE5D0', fg: '#1F2D22' },
  { n: '夜間', bg: '#14171B', fg: '#C8CDD5' }
];
let S = Object.assign({}, DEF, LS.get('ytr:set', {}));

function clampFs(v) { v = parseInt(v, 10); return isNaN(v) ? null : Math.min(128, Math.max(8, v)); }
function ratio() { const h = root.scrollHeight - innerHeight; return h > 0 ? scrollY / h : 0; }
function restoreRatio(r) { scrollTo(0, r * (root.scrollHeight - innerHeight)); }

function applyAll(keepPos) {
  const r = keepPos ? ratio() : 0;
  root.style.setProperty('--bg', S.bg);
  root.style.setProperty('--fg', S.fg);
  root.style.setProperty('--fs', S.fs + 'px');
  root.style.setProperty('--lh', S.lh);
  root.style.setProperty('--ff', FONTS[S.ff] || FONTS.serif);
  $('themeColor').content = S.bg;
  $('fsRange').value = S.fs; $('fsNum').value = S.fs; $('lhRange').value = S.lh;
  $('lhVal').textContent = Number(S.lh).toFixed(1);
  $('bgColor').value = S.bg.toLowerCase(); $('fgColor').value = S.fg.toLowerCase();
  [['bgHex', S.bg], ['fgHex', S.fg]].forEach(([id, c]) => { const el = $(id); if (document.activeElement !== el) { el.value = c.toUpperCase(); el.classList.remove('bad'); } });
  document.querySelectorAll('#ffSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.ff === S.ff));
  document.querySelectorAll('#presets button').forEach((b, i) =>
    b.setAttribute('aria-pressed', PRESETS[i].bg.toLowerCase() === S.bg.toLowerCase() && PRESETS[i].fg.toLowerCase() === S.fg.toLowerCase()));
  LS.set('ytr:set', S);
  if (keepPos) restoreRatio(r);
}
function setFs(v) { const n = clampFs(v); if (n === null) { $('fsNum').value = S.fs; return; } S.fs = n; applyAll(true); }

PRESETS.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.n; b.style.background = p.bg; b.style.color = p.fg;
  b.addEventListener('click', () => { S.bg = p.bg; S.fg = p.fg; applyAll(); });
  $('presets').appendChild(b);
});
$('fsRange').addEventListener('input', e => setFs(e.target.value));
$('fsNum').addEventListener('change', e => setFs(e.target.value));
$('fsMinus').addEventListener('click', () => setFs(S.fs - 1));
$('fsPlus').addEventListener('click', () => setFs(S.fs + 1));
$('lhRange').addEventListener('input', e => { S.lh = parseFloat(e.target.value); applyAll(true); });
$('bgColor').addEventListener('input', e => { S.bg = e.target.value; applyAll(); });
$('fgColor').addEventListener('input', e => { S.fg = e.target.value; applyAll(); });
function hexInput(id, key) {
  const el = $(id);
  el.addEventListener('input', () => {
    const v = el.value.trim();
    const m = /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.exec(v);
    el.classList.toggle('bad', !m && v !== '');
    if (!m) return;
    let h = m[1]; if (h.length === 3) h = h.replace(/./g, '$&$&');
    S[key] = '#' + h.toUpperCase(); applyAll();
  });
  el.addEventListener('blur', () => { el.value = S[key].toUpperCase(); el.classList.remove('bad'); });
}
hexInput('bgHex', 'bg'); hexInput('fgHex', 'fg');
$('ffSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.ff = b.dataset.ff; applyAll(true); } });
$('resetBtn').addEventListener('click', () => { S = Object.assign({}, DEF); applyAll(true); });

/* ===== 彈窗 ===== */
function openMenu() { overlay.classList.add('open'); document.body.style.overflow = 'hidden'; setTimeout(() => bookInput.focus({ preventScroll: true }), 50); }
function closeMenu() { overlay.classList.remove('open'); document.body.style.overflow = ''; }
$('menuBtn').addEventListener('click', openMenu);
$('closeBtn').addEventListener('click', closeMenu);
overlay.addEventListener('click', e => { if (e.target === overlay) closeMenu(); });

/* ===== 畫面狀態 ===== */
let currentBook = '', rawText = '', bookListData = [];

function setView(v) {
  document.body.dataset.view = v;
  listHead.hidden = v !== 'list';
  closeSearch();
  topBar.classList.remove('hide');
}
function note(msg, cls, sub) {
  bookContent.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'note' + (cls ? ' ' + cls : '');
  d.textContent = msg;
  if (sub) { const s = document.createElement('small'); s.textContent = sub; d.appendChild(s); }
  bookContent.appendChild(d);
}
function showError(msg) {
  currentBook = ''; rawText = '';
  bookTitle.hidden = true;
  setView('book'); topTitle.textContent = '';
  note(msg, 'err');
}

/* ===== 書目 ===== */
function buildList(books) {
  const ul = document.createElement('ul');
  ul.className = 'books';
  books.forEach(name => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.textContent = name;
    if (name === currentBook) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => { closeLib(); bookInput.value = name; if (name !== currentBook) loadBook(name); });
    li.appendChild(b); ul.appendChild(li);
  });
  return ul;
}
function renderBookList(books) {
  currentBook = ''; rawText = '';
  setView('list');
  bookTitle.hidden = true;
  topTitle.textContent = '書目';
  $('pct').textContent = '';
  listCount.textContent = books.length ? books.length + ' 本' : '';
  bookContent.innerHTML = '';
  bookContent.appendChild(buildList(books));
  scrollTo(0, 0);
}

/* ===== 載入書籍（沿用原有邏輯） ===== */
async function loadBook(bookName) {
  if (!bookName || !bookName.trim()) { openMenu(); showError('請輸入書名'); return; }
  const name = bookName.trim();
  if (/[\\/]|\.\./.test(name)) { showError('書名包含非法字元，請重新輸入'); return; }
  const filePath = 'content/' + name + '.txt';

  closeMenu(); closeLib();
  bookTitle.hidden = true;
  setView('book');
  topTitle.textContent = name;
  note('載入中…');
  readBtn.disabled = true;

  try {
    const response = await fetch(filePath, { method: 'GET', headers: { 'Accept': 'text/plain; charset=utf-8' } });
    if (!response.ok) {
      if (response.status === 404) showError('找不到這本書「' + name + '」，請檢查書名是否正確');
      else showError('載入失敗 (HTTP ' + response.status + ')，請稍後再試');
      return;
    }
    const text = await response.text();
    if (!text.trim()) { showError('「' + name + '」內容為空，請檢查檔案'); return; }

    currentBook = name; rawText = text;
    bookTitle.textContent = '《' + name + '》';
    bookTitle.hidden = false;
    bookContent.textContent = text;
    topTitle.textContent = name;
    const saved = LS.get('ytr:pos:' + name, 0);
    requestAnimationFrame(() => { restoreRatio(saved); onScroll(); });
  } catch (err) {
    console.error('載入書籍出錯:', err);
    showError('網絡錯誤，請檢查網絡連線後再試');
  } finally {
    readBtn.disabled = false;
  }
}

async function loadBookListFromCSV() {
  setView('list');
  listCount.textContent = '';
  try {
    const response = await fetch('content/booklist.csv', { method: 'GET', headers: { 'Accept': 'text/csv; charset=utf-8' } });
    if (!response.ok) {
      note('找不到書單檔案', '', '請建立 content/booklist.csv，每行一個書名（不含 .txt）');
      return;
    }
    const csvText = await response.text();
    const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
    let books = lines;
    if (lines.length > 0) {
      const first = lines[0].toLowerCase();
      if (first.includes('書名') || first.includes('book') || first.includes('名稱') || first.includes('name')) books = lines.slice(1);
    }
    books = books.filter(n => n.length > 0);
    bookListData = books;
    if (books.length === 0) note('書單是空的', '', '請在 content/booklist.csv 加入書名（每行一個）');
    else renderBookList(books);
  } catch (err) {
    console.error('載入書單CSV失敗:', err);
    note('載入書單失敗', 'err', '請檢查網絡，並確保 content/booklist.csv 存在');
  }
}

/* 書目彈窗：隨時查看所有書，不離開正在讀的書 */
function openLib() {
  const body = $('libBody');
  body.innerHTML = '';
  if (bookListData.length) body.appendChild(buildList(bookListData));
  else { const d = document.createElement('div'); d.className = 'note'; d.style.padding = '40px 0'; d.textContent = '書單未能載入，或書單是空的'; body.appendChild(d); }
  $('libCount').textContent = bookListData.length ? bookListData.length + ' 本' : '';
  libOverlay.classList.add('open'); document.body.style.overflow = 'hidden';
  const c = body.querySelector('[aria-current]'); if (c) c.scrollIntoView({ block: 'center' });
}
function closeLib() { libOverlay.classList.remove('open'); if (!overlay.classList.contains('open')) document.body.style.overflow = ''; }
$('libBtn').addEventListener('click', openLib);
$('libClose').addEventListener('click', closeLib);
libOverlay.addEventListener('click', e => { if (e.target === libOverlay) closeLib(); });
readBtn.addEventListener('click', () => loadBook(bookInput.value));
bookInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); loadBook(bookInput.value); } });

/* ===== 搜尋 ===== */
let marks = [], idx = -1, searched = false;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function openSearch() {
  if (!currentBook) return;
  sbar.classList.add('open');
  sInput.focus(); sInput.select();
}
function clearMarks() {
  if (searched && currentBook) { const r = ratio(); bookContent.textContent = rawText; restoreRatio(r); }
  searched = false; marks = []; idx = -1; sCount.textContent = '';
}
function closeSearch() { sbar.classList.remove('open'); clearMarks(); sInput.value = ''; }
function runSearch() {
  const q = sInput.value;
  clearMarks();
  if (!q || !currentBook) return;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const parts = []; let last = 0, m, n = 0;
  while ((m = re.exec(rawText)) && n < 5000) {
    parts.push(esc(rawText.slice(last, m.index)), '<mark>' + esc(m[0]) + '</mark>');
    last = m.index + m[0].length; n++;
  }
  if (!n) { sCount.textContent = '找不到'; return; }
  parts.push(esc(rawText.slice(last)));
  bookContent.innerHTML = parts.join('');
  searched = true;
  marks = Array.from(bookContent.querySelectorAll('mark'));
  go(0);
}
function go(i) {
  if (!marks.length) return;
  if (marks[idx]) marks[idx].classList.remove('cur');
  idx = (i + marks.length) % marks.length;
  const m = marks[idx];
  m.classList.add('cur');
  m.scrollIntoView({ block: 'center' });
  sCount.textContent = (idx + 1) + ' / ' + marks.length + (marks.length >= 5000 ? '+' : '');
}
let st;
sInput.addEventListener('input', () => { clearTimeout(st); st = setTimeout(runSearch, 300); });
sInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault(); clearTimeout(st);
  if (!searched || sInput.value === '') runSearch(); else go(e.shiftKey ? idx - 1 : idx + 1);
});
$('searchBtn').addEventListener('click', () => sbar.classList.contains('open') ? closeSearch() : openSearch());
$('sNext').addEventListener('click', () => { if (!searched) runSearch(); else go(idx + 1); });
$('sPrev').addEventListener('click', () => { if (!searched) runSearch(); else go(idx - 1); });
$('sClose').addEventListener('click', closeSearch);

/* ===== 捲動：進度、回頂部、自動收起頂欄、記住位置 ===== */
let lastY = 0, tick = false, saveT;
function onScroll() {
  const y = scrollY, r = ratio();
  $('bar').style.transform = 'scaleX(' + (document.body.dataset.view === 'book' ? r : 0) + ')';
  $('topBtn').classList.toggle('show', y > 600);
  if (!sbar.classList.contains('open')) {
    if (y > lastY + 6 && y > 120) topBar.classList.add('hide');
    else if (y < lastY - 6) topBar.classList.remove('hide');
  }
  lastY = y;
  if (currentBook) {
    $('pct').textContent = Math.round(r * 100) + '%';
    clearTimeout(saveT);
    saveT = setTimeout(() => LS.set('ytr:pos:' + currentBook, r), 400);
  }
}
addEventListener('scroll', () => { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; onScroll(); }); }, { passive: true });
$('topBtn').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

/* ===== 鍵盤 ===== */
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (libOverlay.classList.contains('open')) closeLib();
    else if (overlay.classList.contains('open')) closeMenu();
    else if (sbar.classList.contains('open')) closeSearch();
  }
});

/* ===== 啟動 ===== */
applyAll();
loadBookListFromCSV();
})();
</script>
</body>
</html>
